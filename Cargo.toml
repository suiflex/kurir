[package]
name = "kurir"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Portable MCP server registration and harness integration toolkit"
repository = "https://github.com/suiflex/kurir"
homepage = "https://github.com/suiflex/kurir"
readme = "README.md"
keywords = ["mcp", "model-context", "harness", "cli", "integration"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "kurir"
path = "src/main.rs"
